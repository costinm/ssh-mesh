[build]
target = "xtensa-esp32-espidf"

# esp-idf-sys otherwise treats an alternate CARGO_TARGET_DIR as the workspace
# root and silently skips this crate's sdkconfig.defaults.
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[target.xtensa-esp32-espidf]
linker = "tools/ldproxy-wrapper.sh"

[target.xtensa-esp32s3-espidf]
linker = "tools/ldproxy-wrapper.sh"

[unstable]
build-std = ["std", "panic_abort"]
