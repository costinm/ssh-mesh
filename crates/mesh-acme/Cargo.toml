[package]
name = "mesh-acme"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
log = "0.4"
rustls-pki-types = "1"
p256 = { version = "=0.14.0-rc.7", features = ["std", "pem", "pkcs8"] }
pkcs8 = { version = "=0.11.0-rc.11", features = ["std", "pem"] }
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
toml = "0.8"
toml_edit = "0.22"
x509-parser = "0.18.0"

[dev-dependencies]
tempfile = "3.3"
time = "0.3"
