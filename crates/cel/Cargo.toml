[package]
name = "micro-cel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A minimal CEL evaluator"
publish = false

[features]
translate = []
program = []
service = ["program", "dep:component-call"]
program-host = ["program", "translate", "dep:serde", "dep:toml"]

[[bin]]
name = "celc"
required-features = ["translate"]

[[example]]
name = "measure"
required-features = ["program-host"]

[dependencies]
component-call = { path = "../component-call", optional = true }
mesh-api = { path = "../mesh-api", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
