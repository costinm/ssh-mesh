version = 1
schema = {params = 1, response = 2, count = 3}
[[lists]]
name = "caller"
context = {params = {"1" = "hello"}}
rules = [{set = "response", expr = "call(12, 3, params)"}, {after_ms = 5}, {break_if = "response == 7"}, {expr = "0"}]
[[lists]]
name = "independent"
context = {count = 2}
rules = [{after_ms = 3}, {set = "count", expr = "count + 1"}, {expr = "count"}]
