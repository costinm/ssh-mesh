[package]
name = "quic-base"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
std = ["mesh-api/std", "host-pools"]
host-pools = ["mesh-api/host-pools"]
rust-crypto = ["dep:aes-gcm", "dep:hkdf", "dep:sha2", "dep:zeroize"]

[dependencies]
mesh-api = { path = "../mesh-api", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"], optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
zeroize = { version = "1.8", default-features = false, optional = true }

[lib]
name = "quic_base"
path = "src/lib.rs"
