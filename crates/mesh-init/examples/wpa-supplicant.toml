# Build-user repo WPA supplicant for lmesh NAN/USD tests.
#
# Service name from filename: wpa-supplicant
# Control dir: /run/mesh/wpa-supplicant
# mesh-init creates /run/mesh/wpa-supplicant and chowns it to User/Group.

[Service]
Type = "exec"
ExecStart = "wpa_supplicant -g /run/mesh/wpa-supplicant/global -G plugdev -c /home/system/etc/wpa-supplicant.conf -dd"
WorkingDirectory = "target"
User = "build"
Group = "plugdev"
SupplementaryGroups = ["plugdev"]
Restart = "always"
RestartSec = "1s"
KillMode = "control-group"
TimeoutStopSec = "5s"
NoNewPrivileges = false
CapabilityBoundingSet = [
  "CAP_SETPCAP",
  "CAP_NET_ADMIN",
  "CAP_NET_RAW",
]
AmbientCapabilities = [
  "CAP_NET_ADMIN",
  "CAP_NET_RAW",
]
StandardOutput = "inherit"
StandardError = "inherit"

[Environment]
RUST_LOG = "info"
