<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesh dashboard</title>
<style>:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#62718a;--line:#d5ddeb;--accent:#075ec7;--bad:#a22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}header,main{max-width:1280px;margin:auto;padding:18px}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 10px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.wide{grid-column:1/-1}section,.item{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;min-width:0}.muted,.meta{color:var(--muted)}.meta{font-size:13px}button,select,input{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{min-width:0;flex:1 1 180px}.row select,.row input{min-width:0;max-width:100%}label{display:grid;gap:4px;color:var(--muted);font-size:13px}.chip{display:inline-block;border:1px solid var(--line);border-radius:9px;padding:2px 6px;margin:2px;font-size:12px}details{margin-top:7px}summary{cursor:pointer;color:var(--accent)}pre{max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--bad)}#nodeList{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(510px,1fr))}.item{background:#f9fbff;padding:9px}.node-line{display:flex;gap:8px;align-items:center;min-width:0;cursor:pointer;line-height:1.45}.node-name{white-space:nowrap}.node-age,.node-addresses{color:var(--muted);font-size:13px}.node-addresses{min-width:0;overflow-wrap:anywhere}.mode-link,.address-link,.ping-result,.node-toggle{border:0;background:transparent;padding:0;color:var(--accent);font:inherit;cursor:pointer}.node-toggle{font-size:18px;margin-left:auto;width:22px}.node-expanded{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.hidden{display:none}</style></head>
<body><header><h1>Mesh dashboard</h1><p id="status" class="muted">Loading services…</p></header><main class="grid">
<section id="nodeStatus"><h2>This node</h2><p class="muted">Loading local status…</p></section>
<section id="nodes" class="wide"><h2>Discovered nodes</h2><p class="muted">Loading discovery inventory…</p></section>
<section id="probe"><h2>Pair probe</h2><p class="muted">Loading probe capability…</p></section>
<section class="wide"><h2>Last operation</h2><div id="result" class="muted">No operation yet.</div></section>
</main><script>
const base=new URL('../mesh/',location.href),key=new URL(location.href).searchParams.get('apikey');
const caps=new Map(),state={nodes:[],bss:[],nodeWindow:'600'};const $=id=>document.getElementById(id);
const url=p=>{const u=new URL(p,base);if(key)u.searchParams.set('apikey',key);return u};
const data=v=>v?.result?.data??v?.data??v;const short=v=>String(v||'—').replace(/^(.{9}).+(.{7})$/,'$1…$2');
async function request(path,opts){const r=await fetch(url(path),opts);const v=await r.json().catch(()=>({error:`HTTP ${r.status}`}));if(!r.ok)throw Error(v.error||`HTTP ${r.status}`);return v}
function show(title,value,error){const out=$('result');out.replaceChildren();const h=document.createElement('strong');h.textContent=error?`Failed · ${title}`:`Response · ${title}`;if(error)h.className='error';const payload=data(value)||{};const p=document.createElement('p');p.textContent=error||payload.error||payload.message||(Number.isFinite(payload.sent)?`Sent on ${payload.sent} local media.`:'Request accepted.');const d=document.createElement('details'),s=document.createElement('summary'),pre=document.createElement('pre');s.textContent='Details (JSON)';pre.textContent=JSON.stringify(value||{error},null,2);d.append(s,pre);out.append(h,p,d)}
async function call(tool,args,label,quiet=false){try{const out=await request(`services/${encodeURIComponent(tool.service)}/call/${encodeURIComponent(tool.name)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args||{})});if(!quiet)show(label,out);return out}catch(e){if(!quiet)show(label,null,e.message);throw e}}
async function callDirected(tool,args,to,label){if(!to)throw Error('This node has no advertised radio MAC for directed control.');const path=`services/${encodeURIComponent(tool.service)}/call/${encodeURIComponent(tool.name)}?mode=oneway&to=${encodeURIComponent(to)}`;return callPath(path,args,label)}
async function callPath(path,args,label){try{const out=await request(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args||{})});show(label,out);return out}catch(e){show(label,null,e.message);throw e}}
function tool(name){return caps.get(name)}
function nodeList(value){const v=data(value)||{};return v.discovered_devices||v.rawnan?.discovered_devices||v.observed_announces||v.rawnan?.observed_announces||v.devices||v.nodes||[]}
function readableNode(node){return node.announce?.device_name||node.device_name||node.name||short(node.id||node.device_id)}
function nodeMark(node){const p=String(node.platform||node.announce?.platform||'').toLowerCase();if(p==='android')return'A';if(p==='host'||p==='linux')return'L';if(p.includes('esp')||p==='firmware')return'E';return'?'}
function refreshSelect(select){const old=select.value;select.replaceChildren(new Option('Choose a node',''));for(const node of state.nodes)select.add(new Option(`${readableNode(node)} · ${short(node.id||node.device_id)}`,node.id||node.device_id));if([...select.options].some(x=>x.value===old))select.value=old}
async function refreshNodes(){const inventory=tool('wifi.rawnan.status')||tool('lmesh.nodes')||tool('radio.devices');if(!inventory)throw Error('No node inventory tool is registered.');const out=await call(inventory,{},'Refresh discovered nodes',true),v=data(out)||{};state.nodes=nodeList(out);state.bss=v.radio_bss||v.rawnan?.radio_bss||v.observed_aps||v.rawnan?.observed_aps||[];if(!state.nodes.length&&state.localStatus)state.nodes=nodeList(state.localStatus);renderNodes();if(window.refreshProbeNodes)window.refreshProbeNodes()}
function addFact(root,label,value){if(value===undefined||value===null||value==='')return;const p=document.createElement('p');p.className='meta';const key=document.createElement('strong');key.textContent=`${label}: `;p.append(key,document.createTextNode(String(value)));root.append(p)}
function nodeAgeMs(node){const ages=[node.nan?.age_ms,...Object.values(node.observations||{}).map(value=>value?.age_ms)].filter(value=>Number.isFinite(value));return ages.length?Math.min(...ages):undefined}
function nodeAge(node){const age=nodeAgeMs(node);if(age===undefined)return undefined;return age<1000?`${age}ms`:age<60000?`${Math.round(age/1000)}s`:`${Math.round(age/60000)}m`}
function nodeAddresses(node){const a=node.announce||node,network=a.network_name?` (${a.network_name})`:'';const out=[];if(a.sta_link_local_v6)out.push({label:'STA',address:a.sta_link_local_v6,network});if(a.ap_link_local_v6)out.push({label:'AP',address:a.ap_link_local_v6,network});if(!out.length&&node.peer)out.push({label:'NOW',address:node.peer,network:''});return out}
function discoveryEvidence(node){const names={udp_multicast:'UDP6',nan:'NAN',now:'NOW',espnow:'NOW',raw_action:'NOW'};const seen=Object.keys(node.observations||{}).map(source=>names[source]||source);const ids=[node.bssid,node.peer].filter(Boolean).map(value=>String(value).toLowerCase());const aps=state.bss.filter(ap=>ids.includes(String(ap.bssid||'').toLowerCase()));for(const ap of aps){const ssid=ap.ssid||'hidden SSID';seen.push(`AP ${ssid} (${ap.bssid})`)}return [...new Set(seen)]}
function transportFacts(node){return nodeAddresses(node).map(entry=>`${entry.label} ${entry.address}${entry.network}`)}
function nodeTransportPane(node){const start=tool('transport.start');if(!start)return null;const peer=node.peer;const box=document.createElement('div');box.className='transport-pane';if(!peer){box.textContent='No radio endpoint was advertised for directed transport control.';box.className='muted';return box}const row=document.createElement('div');row.className='row';const mode=document.createElement('select'),ssid=document.createElement('input'),psk=document.createElement('input'),bssid=document.createElement('input'),channel=document.createElement('input'),open=document.createElement('input');mode.append(new Option('NAN + NOW','nan_now'),new Option('STA','sta'),new Option('AP + NAN','ap'));ssid.placeholder='SSID (STA only)';psk.type='password';psk.autocomplete='new-password';psk.placeholder='PSK (optional)';bssid.placeholder='BSSID (optional)';channel.type='number';channel.min='1';channel.max='196';channel.placeholder='Channel';open.type='checkbox';function field(text,input){const l=document.createElement('label');l.textContent=text;l.append(input);row.append(l)}field('Mode',mode);field('SSID',ssid);field('PSK',psk);field('BSSID',bssid);field('Channel',channel);field('Open network',open);const button=document.createElement('button');button.textContent='Start transport';button.onclick=async event=>{event.stopPropagation();try{const passphrase=psk.value||undefined,args=mode.value==='sta'?{kind:1,ssid:ssid.value,passphrase,bssid:bssid.value||undefined,channel:channel.value?Number(channel.value):undefined,open:open.checked}:mode.value==='ap'?{kind:6,ap:1,now:1,passphrase,channel:channel.value?Number(channel.value):undefined,open:open.checked}:{kind:6,now:1,channel:channel.value?Number(channel.value):undefined};if(args.kind===1&&!args.ssid)throw Error('STA needs an SSID.');if(open.checked&&passphrase)throw Error('An open network cannot use a PSK.');const out=await callDirected(start,args,peer,`Start ${mode.options[mode.selectedIndex].text} on ${readableNode(node)}`);if(data(out)?.accepted)await refreshNodes()}catch(e){/* callDirected already displays the failure. */}};row.append(button);box.append(row);return box}
async function pingNode(node,result){const ping=tool('lmesh.ping');if(!ping||!node.peer){result.textContent='unavailable';return}const started=performance.now();result.textContent='…';try{const path=`services/${encodeURIComponent(ping.service)}/call/${encodeURIComponent(ping.name)}?to=${encodeURIComponent(node.peer)}`;const out=await request(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wait_ms:900})});const elapsed=Math.round(performance.now()-started);result.textContent=`${elapsed}ms`;result.className='ping-result';result.onclick=event=>{event.stopPropagation();show(`Ping ${readableNode(node)}`,out)}}catch(error){result.textContent='failed';result.className='ping-result error';result.onclick=event=>{event.stopPropagation();show(`Ping ${readableNode(node)}`,null,error.message)}}}
function renderNodes(){const root=$('nodes');root.replaceChildren();const h=document.createElement('h2');h.textContent='Discovered nodes';const actions=document.createElement('div');actions.className='row';const discover=tool('discovery.ping');if(discover){const button=document.createElement('button');button.className='primary';button.textContent='Discover';button.onclick=async()=>{try{const out=await call(discover,{},'Discover',true);await Promise.allSettled([refreshStatus(),refreshNodes()]);show('Discover',out)}catch(e){show('Discover',null,e.message)}};actions.append(button)}const refresh=document.createElement('button');refresh.textContent='Refresh';refresh.onclick=()=>Promise.allSettled([refreshStatus(),refreshNodes()]);const windowSelect=document.createElement('select');windowSelect.title='Node recency';for(const [value,label] of [['600','Last 10 min'],['1800','Last 30 min'],['3600','Last hour'],['all','All tracked']])windowSelect.add(new Option(label,value,value===state.nodeWindow));windowSelect.onchange=()=>{state.nodeWindow=windowSelect.value;renderNodes();if(window.refreshProbeNodes)window.refreshProbeNodes()};actions.append(refresh,windowSelect);root.append(h,actions);const maxAge=state.nodeWindow==='all'?Infinity:Number(state.nodeWindow)*1000,visible=state.nodes.filter(node=>{const age=nodeAgeMs(node);return age===undefined||age<=maxAge});const count=document.createElement('p');count.className='meta';count.textContent=state.nodeWindow==='all'?`${visible.length} tracked node${visible.length===1?'':'s'}.`:`${visible.length} node${visible.length===1?'':'s'} seen in the selected window (${state.nodes.length} tracked).`;root.append(count);const list=document.createElement('div');list.id='nodeList';for(const node of visible){const item=document.createElement('div');item.className='item';const a=node.announce||node,mode=node.active_transport?.state||a.transport_mode||'unknown';const line=document.createElement('div');line.className='node-line';const title=document.createElement('strong');title.className='node-name';title.textContent=readableNode(node);line.append(title);const age=nodeAge(node);if(age){const value=document.createElement('span');value.className='node-age';value.textContent=`(${age})`;line.append(value)}const expanded=document.createElement('div');expanded.className='node-expanded hidden';const modeLink=document.createElement('button');modeLink.className='mode-link';modeLink.textContent=`Mode: ${mode} (${nodeMark(node)})`;modeLink.onclick=event=>{event.stopPropagation();expanded.classList.remove('hidden')};line.append(modeLink);const evidence=discoveryEvidence(node);if(evidence.length){const seen=document.createElement('span');seen.className='node-age';seen.textContent=`Seen: ${evidence.join(', ')}`;line.append(seen)}const addresses=document.createElement('span');addresses.className='node-addresses';for(const [index,entry] of nodeAddresses(node).entries()){if(index)addresses.append(document.createTextNode(' · '));const address=document.createElement('button');address.className='address-link';address.textContent=`${entry.label} ${entry.address}${entry.network}`;const result=document.createElement('button');result.className='ping-result';address.onclick=event=>{event.stopPropagation();pingNode(node,result)};addresses.append(address,document.createTextNode(' '),result)}line.append(addresses);const toggle=document.createElement('button');toggle.className='node-toggle';toggle.title='Node details and transport controls';toggle.textContent='⌄';toggle.onclick=event=>{event.stopPropagation();expanded.classList.toggle('hidden')};line.onclick=()=>expanded.classList.toggle('hidden');line.append(toggle);item.append(line);const control=nodeTransportPane(node);if(control)expanded.append(control);const d=document.createElement('details'),s=document.createElement('summary'),pre=document.createElement('pre');s.textContent='JSON';pre.textContent=JSON.stringify(node,null,2);d.append(s,pre);expanded.append(d);item.append(expanded);list.append(item)}root.append(list);if(!visible.length)root.append(Object.assign(document.createElement('p'),{className:'muted',textContent:state.nodes.length?'No nodes in the selected recency window.':'No nodes currently advertised.'}))}
function facts(root,entries,empty){root.replaceChildren();for(const [label,value] of entries){if(value===undefined||value===null||value==='')continue;const row=document.createElement('p');row.className='meta';const strong=document.createElement('strong');strong.textContent=`${label}: `;row.append(strong,document.createTextNode(String(value)));root.append(row)}if(!root.childNodes.length)root.append(Object.assign(document.createElement('p'),{className:'muted',textContent:empty}))}
async function refreshStatus(){const command=tool('lmesh.status')||tool('mesh.status');if(!command)return;const out=await call(command,{},'Refresh this node',true);const v=data(out)||{};state.localStatus=v;const root=$('nodeStatus'),h=document.createElement('h2');h.textContent='This node';root.replaceChildren(h);const rawnan=v.rawnan||{},recent=(rawnan.discovered_devices||[]).filter(node=>nodeAgeMs(node)<=600000).length+(rawnan.followups||[]).filter(item=>Number(item.age_ms??0)<=600000).length;let rows=0;for(const item of v.udp6_interfaces||[]){const address=item.link_local_v6||item.addresses?.[0];if(!address)continue;const network=(item.networks||[]).join(', ');addFact(root,`UDP6${network?` (${network})`:''}`,`${address}%${item.interface}`);rows++}addFact(root,'NAN cluster',rawnan.cluster_bssid);addFact(root,'NAN peers / follow-ups (10m)',recent);if(!rows&&!rawnan.cluster_bssid)root.append(Object.assign(document.createElement('p'),{className:'muted',textContent:'No current-node addresses were returned.'}));const d=document.createElement('details'),s=document.createElement('summary'),pre=document.createElement('pre');s.textContent='Details';pre.textContent=JSON.stringify(v,null,2);d.append(s,pre);root.append(d)}
function commonTransports(source,target){if(!source||!target)return[];const sa=source.announce||source,ta=target.announce||target,sc=Number(sa.probe_capabilities||0),tc=Number(ta.probe_capabilities||0),out=[];if((sc&1)&&(tc&1))out.push('NAN');if((sc&2)&&(tc&2)&&source.peer&&target.peer)out.push('NOW');const sameNetwork=sa.network_name&&ta.network_name&&sa.network_name===ta.network_name;const sourceUdp=sa.sta_link_local_v6||sa.ap_link_local_v6,targetUdp=ta.sta_link_local_v6||ta.ap_link_local_v6;if((sc&16)&&(tc&16)&&sameNetwork&&sourceUdp&&targetUdp)out.push('UDP6');return out}
function renderProbe(){const root=$('probe');root.replaceChildren();const h=document.createElement('h2');h.textContent='Pair probe';const note=document.createElement('p');note.className='meta';note.textContent='Select two nodes to compare currently advertised common transports and addresses.';const row=document.createElement('div');row.className='row';const source=document.createElement('select'),destination=document.createElement('select'),bearer=document.createElement('select');function field(text,input){const l=document.createElement('label');l.textContent=text;l.append(input);row.append(l)}field('Source node',source);field('Destination node',destination);field('Common transport',bearer);const result=document.createElement('p');result.className='meta';function update(){const a=state.nodes.find(n=>(n.id||n.device_id)===source.value),b=state.nodes.find(n=>(n.id||n.device_id)===destination.value),choices=commonTransports(a,b);bearer.replaceChildren(...choices.map(v=>new Option(v,v)));result.textContent=!a||!b?'Choose two nodes.':choices.length?`Common: ${choices.join(', ')}. ${readableNode(a)}: ${transportFacts(a).join('; ')||'no advertised address'}; ${readableNode(b)}: ${transportFacts(b).join('; ')||'no advertised address'}.`:'No verified common transport is advertised.'}source.onchange=destination.onchange=update;root.append(h,note,row,result);window.refreshProbeNodes=()=>{refreshSelect(source);refreshSelect(destination);update()};window.refreshProbeNodes()}
async function load(){try{const services=await request('services');for(const service of services.services||[]){const listed=await request(`services/${encodeURIComponent(service.name)}/tools`);for(const item of Array.isArray(listed)?listed:listed.tools||[])if(item.name&&!caps.has(item.name))caps.set(item.name,{service:service.name,name:item.name,tool:item})}$('status').textContent='Ready.';renderProbe();await refreshStatus();await refreshNodes()}catch(e){$('status').className='error';$('status').textContent=e.message}}load();
</script></body></html>
