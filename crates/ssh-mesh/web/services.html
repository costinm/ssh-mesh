<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesh Services</title>
  <style>
    :root { color-scheme: light; --bg:#f6f8fb; --panel:#fff; --text:#172033; --muted:#667085; --border:#d8dee8; --accent:#1466cc; }
    * { box-sizing: border-box; } body { margin:0; font:14px system-ui,sans-serif; color:var(--text); background:var(--bg); }
    header, main { max-width:1100px; margin:auto; } header { padding:20px; } main { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:0 20px 28px; }
    section { border:1px solid var(--border); border-radius:8px; background:var(--panel); padding:14px; } h1,h2 { margin:0 0 12px; } h1 { font-size:22px; } h2 { font-size:15px; }
    button, select, input, textarea { font:inherit; } button { padding:7px 10px; border:1px solid var(--border); border-radius:5px; background:#fff; cursor:pointer; } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .service { display:block; width:100%; text-align:left; margin:6px 0; } .muted { color:var(--muted); } label { display:grid; gap:4px; margin:10px 0; }
    textarea { min-height:220px; width:100%; resize:vertical; border:1px solid var(--border); border-radius:5px; padding:8px; font-family:ui-monospace,monospace; }
    pre { white-space:pre-wrap; overflow:auto; background:#f8fafc; border:1px solid var(--border); padding:10px; border-radius:5px; min-height:80px; }
    .row { display:flex; gap:8px; align-items:end; flex-wrap:wrap; } .row label { min-width:180px; flex:1; } @media (max-width:700px) { main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><h1>Mesh Services</h1><div id="status" class="muted">Loading service registry…</div></header>
  <main>
    <section><h2>Registered services</h2><div id="services"></div></section>
    <section>
      <h2 id="title">Raw record</h2>
      <div class="row">
        <label>Mode<select id="mode"><option value="">Infer from id</option><option value="request">Request</option><option value="oneway">One-way</option></select></label>
        <label>Content<select id="content"><option value="application/json">JSON</option><option value="application/cbor">CBOR upload</option></select></label>
        <label id="file-row" hidden>CBOR record<input id="file" type="file" accept="application/cbor"></label>
      </div>
      <label id="json-row">Tagged-record JSON<textarea id="record">{
  "component": 0,
  "method": 0,
  "id": 1,
  "env": {"1": 4}
}</textarea></label>
      <div class="row"><button id="send" class="primary">Send record</button><button id="tools">Show catalog</button></div>
      <h2>Result</h2><pre id="result"></pre>
      <div id="catalog-panel" hidden>
        <h2>Catalog call</h2>
        <label>Method<select id="method"></select></label>
        <div id="arguments"></div>
        <div class="row"><button id="call" class="primary">Call method</button></div>
      </div>
    </section>
  </main>
  <script>
    const base = new URL('../mesh/', location.href);
    const apiKey = new URL(location.href).searchParams.get('apikey');
    const servicesEl = document.querySelector('#services');
    const resultEl = document.querySelector('#result');
    const statusEl = document.querySelector('#status');
    let service; let catalog = []; let nextId = 1;
    // A valid query key is persisted by the REST endpoint as an HttpOnly
    // cookie. Keep sending it on this first page load; later navigation needs
    // only the cookie and can omit it.
    const url = path => { const value = new URL(path, base); if (apiKey) value.searchParams.set('apikey', apiKey); return value.toString(); };
    function show(value) { resultEl.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2); }
    async function fetchJson(path, options) { const response = await fetch(url(path), options); const value = await response.json().catch(() => ({})); if (!response.ok) throw new Error(value.error || `HTTP ${response.status}`); return value; }
    async function load() {
      try {
        const registry = await fetchJson('services');
        servicesEl.replaceChildren();
        for (const entry of registry.services || []) {
          const button = document.createElement('button'); button.className = 'service'; button.textContent = `${entry.name} (${entry.backend})`;
          button.onclick = async () => { service = entry.name; document.querySelector('#title').textContent = `Raw record — ${service}`; statusEl.textContent = `Selected ${service}`; await loadTools(); };
          servicesEl.append(button); if (!service) button.click();
        }
        statusEl.textContent = registry.services?.length ? statusEl.textContent : 'No services registered';
      } catch (error) { statusEl.textContent = `Registry error: ${error.message}`; }
    }
    function toolsArray(value) { return Array.isArray(value) ? value : (Array.isArray(value.tools) ? value.tools : []); }
    async function loadTools() {
      const panel = document.querySelector('#catalog-panel'); const select = document.querySelector('#method');
      panel.hidden = true; select.replaceChildren(); catalog = [];
      try {
        catalog = toolsArray(await fetchJson(`services/${encodeURIComponent(service)}/tools`));
        for (const tool of catalog) { const option = document.createElement('option'); option.value = tool.name; option.textContent = tool.title ? `${tool.title} (${tool.name})` : tool.name; select.append(option); }
        if (catalog.length) { panel.hidden = false; renderArguments(); }
      } catch (error) { if (!String(error.message).includes('204')) show(`Catalog unavailable: ${error.message}`); }
    }
    function renderArguments() {
      const tool = catalog.find(tool => tool.name === document.querySelector('#method').value); const root = document.querySelector('#arguments'); root.replaceChildren();
      const properties = tool?.inputSchema?.properties || {}; const required = new Set(tool?.inputSchema?.required || []);
      for (const [name, schema] of Object.entries(properties)) {
        const label = document.createElement('label'); label.textContent = schema.title || name; label.dataset.name = name; label.dataset.required = required.has(name);
        const type = Array.isArray(schema.type) ? schema.type.find(type => type !== 'null') : schema.type;
        const input = schema.enum ? document.createElement('select') : document.createElement('input');
        if (schema.enum) for (const value of schema.enum) { const option = document.createElement('option'); option.value = value; option.textContent = value; input.append(option); }
        else if (type === 'boolean') { input.type = 'checkbox'; input.checked = Boolean(schema.default); }
        else { input.type = type === 'integer' || type === 'number' ? 'number' : 'text'; if (schema.default !== undefined) input.value = schema.default; }
        input.dataset.type = type || 'string'; label.append(input); root.append(label);
      }
    }
    function callArguments() {
      const values = {};
      for (const label of document.querySelectorAll('#arguments label')) {
        const input = label.querySelector('input,select'); const name = label.dataset.name; const type = input.dataset.type;
        if (type === 'boolean') values[name] = input.checked;
        else if (input.value || label.dataset.required === 'true') values[name] = type === 'integer' ? Number.parseInt(input.value, 10) : type === 'number' ? Number.parseFloat(input.value) : input.value;
      }
      return values;
    }
    document.querySelector('#content').onchange = event => { const cbor = event.target.value === 'application/cbor'; document.querySelector('#file-row').hidden = !cbor; document.querySelector('#json-row').hidden = cbor; };
    document.querySelector('#send').onclick = async () => {
      if (!service) return show('Select a service first.');
      try {
        const cbor = document.querySelector('#content').value === 'application/cbor';
        const body = cbor ? await document.querySelector('#file').files[0]?.arrayBuffer() : document.querySelector('#record').value;
        if (!body) throw new Error(cbor ? 'Choose one CBOR record.' : 'Enter a tagged record.');
        const mode = document.querySelector('#mode').value; const suffix = mode ? `?mode=${encodeURIComponent(mode)}` : '';
        const response = await fetch(url(`services/${encodeURIComponent(service)}/records${suffix}`), { method:'POST', headers:{'Content-Type':document.querySelector('#content').value,'Accept':'application/json'}, body });
        show(await response.json().catch(() => ({error:`HTTP ${response.status}`})));
      } catch (error) { show(`Error: ${error.message}`); }
    };
    document.querySelector('#tools').onclick = async () => { if (service) { try { show(await fetchJson(`services/${encodeURIComponent(service)}/tools`)); } catch (error) { show(`Catalog error: ${error.message}`); } } };
    document.querySelector('#method').onchange = renderArguments;
    document.querySelector('#call').onclick = async () => {
      if (!service) return show('Select a service first.');
      try {
        const mode = document.querySelector('#mode').value; const suffix = mode ? `?mode=${encodeURIComponent(mode)}` : '';
        const method = document.querySelector('#method').value;
        const arguments = callArguments(); if (mode !== 'oneway') arguments.id = nextId++;
        const response = await fetch(url(`services/${encodeURIComponent(service)}/call/${encodeURIComponent(method)}${suffix}`), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(arguments) });
        show(await response.json().catch(() => ({error:`HTTP ${response.status}`})));
      } catch (error) { show(`Error: ${error.message}`); }
    };
    load();
  </script>
</body>
</html>
